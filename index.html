<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlyBet Aviator - Kenya | Store 1364630</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
  body{background:#f7c948;min-height:100vh;padding:15px}
  .card{max-width:420px;margin:0 auto;background:#fff;border-radius:16px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
  h1{font-size:22px;text-align:center}
  .sub{text-align:center;font-size:13px;color:#555;margin:6px 0 14px}
  .store{background:#111;color:#f7c948;text-align:center;padding:10px;border-radius:10px;font-weight:bold;font-size:14px}
  .balance{background:#111;color:#fff;text-align:center;padding:16px;border-radius:12px;margin:14px 0}
  .balance small{color:#aaa}
  .balance b{font-size:28px;color:#f7c948}
  label{font-size:13px;font-weight:bold;display:block;margin:12px 0 5px}
  input{width:100%;padding:13px;border:2px solid #ddd;border-radius:10px;font-size:16px;outline:none}
  input:focus{border-color:#f7c948}
  .quick{display:flex;gap:8px;margin-top:8px}
  .quick button{flex:1;padding:10px;border:1px solid #ddd;background:#f5f5f5;border-radius:8px;font-weight:bold;cursor:pointer}
  .deposit{width:100%;margin-top:16px;padding:15px;background:#00a651;color:#fff;border:none;border-radius:10px;font-size:17px;font-weight:bold;cursor:pointer}
  .deposit:disabled{opacity:.6}
  #msg{margin-top:12px;text-align:center;font-size:14px;font-weight:bold;min-height:20px}
  .ok{color:#00a651}.err{color:#d00}.info{color:#333}
  .note{text-align:center;font-size:12px;color:#777;margin-top:10px;line-height:1.5}
</style>
</head>
<body>
<div class="card">
  <h1>✈️ FlyBet Aviator - Kenya</h1>
  <p class="sub">Instant STK Push - No Till, No Manual Code</p>
  <div class="store">Store Number: 1364630 - Instant STK Push</div>

  <div class="balance">
    <small>YOUR BALANCE</small><br>
    <b><span id="balance">0</span> KES</b>
  </div>

  <h3 style="text-align:center">DEPOSIT - M-PESA STK</h3>

  <label>M-PESA Phone Number</label>
  <input id="phone" type="tel" placeholder="072..." value="">

  <label>Amount (KES)</label>
  <input id="amount" type="number" placeholder="100" value="100">

  <div class="quick">
    <button onclick="setAmt(100)">100</button>
    <button onclick="setAmt(200)">200</button>
    <button onclick="setAmt(500)">500</button>
    <button onclick="setAmt(1000)">1000</button>
  </div>

  <button id="btn" class="deposit" onclick="deposit()">DEPOSIT VIA M-PESA</button>
  <div id="msg"></div>

  <p class="note">Enter phone & amount, tap DEPOSIT.<br>STK will pop on your phone. Enter M-PESA PIN to complete.<br>Store: 1364630</p>
</div>

<script>
const API = "https://crashstats-api.onrender.com";
let balance = 0;

function setAmt(v){ document.getElementById('amount').value = v; }

function showMsg(t, cls){ 
  const m = document.getElementById('msg');
  m.textContent = t; m.className = cls || 'info';
}

async function deposit(){
  const phone = document.getElementById('phone').value.trim();
  const amount = parseInt(document.getElementById('amount').value);
  const btn = document.getElementById('btn');

  if(!phone || phone.length < 10){ showMsg('Enter valid phone e.g 072...', 'err'); return; }
  if(!amount || amount < 10){ showMsg('Minimum deposit 10 KES', 'err'); return; }

  btn.disabled = true;
  btn.textContent = 'SENDING STK...';
  showMsg('Sending STK to ' + phone + ' - Store 1364630...', 'info');

  try{
    const res = await fetch(API + '/api/deposit', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ phone, amount, store: '1364630' })
    });
    const data = await res.json();
    if(data.success){
      showMsg('PAID! Balance updated', 'ok');
      balance += amount;
      document.getElementById('balance').textContent = balance;
    } else {
      showMsg(data.message || 'STK failed. Try again.', 'err');
    }
  } catch(e){
    showMsg('Network error. Check API is Live in Render.', 'err');
  }
  btn.disabled = false;
  btn.textContent = 'DEPOSIT VIA M-PESA';
}
</script>
</body>
</html>
