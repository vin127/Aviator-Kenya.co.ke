<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FlyBet Aviator - Kenya | Till 1833074</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#FFC107;font-family:Arial,sans-serif}
.top{background:#000;color:#FFC107;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;font-weight:bold}
.top span:last-child{background:#FFC107;color:#000;padding:6px 15px;border-radius:20px}
.card{background:#fff;margin:15px;border-radius:16px;padding:20px;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.card h1{font-size:28px;margin:10px 0}
.plane{font-size:80px}
.stats{display:flex;justify-content:space-around;margin:15px 0}
.stat b{display:block;font-size:20px;color:#000}
.stat small{color:#666}
.btn-yellow{background:#FFC107;color:#000;border:none;width:100%;padding:16px;border-radius:30px;font-size:18px;font-weight:bold;margin:10px 0}
.btn-black{background:#000;color:#FFC107;border:none;width:100%;padding:16px;border-radius:30px;font-size:18px;font-weight:bold}
.deposit-wrap{background:#111;color:#fff;margin:15px;border-radius:16px;padding:20px;text-align:center}
.deposit-wrap input{width:100%;padding:15px;border-radius:10px;border:none;text-align:center;font-size:18px;margin:12px 0}
.till{color:#FFC107;font-weight:bold;font-size:14px;margin-top:8px}
</style>
</head>
<body>
<div class="top"><span>✈️ FLY BET</span><span>LIVE</span></div>

<div class="card">
<div class="plane">✈️</div>
<h1>AVIATOR</h1>
<p>Fly High, Win Big - Kenya's #1 Crash Game</p>
<div class="stats">
<div class="stat"><b>1.5M+</b><small>Players</small></div>
<div class="stat"><b>500x</b><small>Max Win</small></div>
<div class="stat"><b>24/7</b><small>Live</small></div>
</div>
<button class="btn-yellow" onclick="document.getElementById('dep').scrollIntoView()">PLAY AVIATOR NOW</button>
</div>

<div class="deposit-wrap" id="dep">
<h3>💳 DEPOSIT - TILL 1833074</h3>
<p style="color:#aaa;font-size:13px">M-Pesa Buy Goods - Instant</p>
<input type="tel" id="phone" placeholder="2547XXXXXXXX">
<input type="number" id="amt" placeholder="Amount" value="100">
<button class="btn-yellow" onclick="doDeposit()">DEPOSIT TO TILL 1833074</button>
<p class="till">Till Number: 1833074 - Buy Goods</p>
<p id="msg" style="margin-top:12px;color:#FFC107"></p>
</div>

<script>
async function doDeposit(){
 const phone=document.getElementById('phone').value.trim();
 const amount=document.getElementById('amt').value.trim();
 if(!phone.startsWith('254')){alert('Use 2547... format');return}
 document.getElementById('msg').innerText='Sending STK to '+phone+'... Till 1833074';
 try{
  const r=await fetch('https://crashstats-api.onrender.com/api/stkpush',{
   method:'POST',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({phone:phone,amount:amount})
  });
  const d=await r.json();
  document.getElementById('msg').innerText=d.message||'Check phone: Buy goods 1833074';
 }catch(e){
  document.getElementById('msg').innerText='Error - Check Render API is Live';
 }
}
</script>
</body>
</html>
