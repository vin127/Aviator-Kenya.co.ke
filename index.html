<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FlyBet Kenya - Aviator</title><style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{background:#070a10;color:#fff;overflow-x:hidden}
.top{display:flex;justify-content:space-between;align-items:center;padding:10px;background:#0d121f;border-bottom:1px solid #1a2332}
.logo{font-weight:900;color:#00ff88;font-size:14px}
.btn{padding:8px 14px;border-radius:8px;border:0;font-weight:800;cursor:pointer}
.btn-g{background:#00c853;color:#000}.btn-y{background:#ffab00;color:#000}
.game{height:320px;background:radial-gradient(#101a2e,#070a10);position:relative;display:flex;align-items:center;justify-content:center;border-bottom:1px solid #1a2332;overflow:hidden}
.plane{font-size:48px;position:absolute;left:10%;transition:all 0.1s}
.mult{font-size:52px;font-weight:900;color:#00ff88}
.crash{position:absolute;inset:0;background:#ff0a2e88;display:none;align-items:center;justify-content:center;font-size:32px;font-weight:900;z-index:5}
.bets{padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#131a26;border:1px solid #222;border-radius:12px;padding:12px}
.card input{width:100%;padding:12px;background:#000;border:1px solid #333;border-radius:8px;color:#fff;margin:6px 0}
.modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:20;padding:14px}
.modalBox{background:#131a26;border:1px solid #333;border-radius:14px;padding:18px;width:100%;max-width:360px}
.tab{display:flex;gap:8px;margin-bottom:12px}
.tab div{flex:1;padding:10px;text-align:center;border-radius:8px;background:#1a2332;cursor:pointer}
.tab .active{background:#00c853;color:#000;font-weight:800}
.h{font-size:12px;color:#888;margin-top:6px}
</style></head><body>
<div class="top"><div class="logo">✈️ FLYBET</div><div><span id="balText">KES 0</span> <button class="btn btn-g" onclick="openDeposit()">Deposit</button> <button class="btn btn-y" onclick="openAuth()">Login</button> <button id="logoutBtn" style="display:none" class="btn" onclick="logout()">Logout</button></div></div>
<div class="game" id="gameArea"><div class="mult" id="mult">1.00x</div><div class="plane" id="plane">✈️</div><div class="crash" id="crashBox">💥 CRASHED <span id="crashMult"></span></div></div>
<div class="bets">
<div class="card"><h3>Bet 1 - Min 50</h3><input id="bet1" type="number" value="50" min="50"><button id="b1Btn" class="btn btn-g" style="width:100%;padding:12px" onclick="placeBet(1)">BET 50</button><div class="h">Auto: <input id="auto1" type="number" value="2.0" style="width:60px;padding:4px"></div></div>
<div class="card"><h3>Bet 2 - Min 50</h3><input id="bet2" type="number" value="50" min="50"><button id="b2Btn" class="btn btn-g" style="width:100%;padding:12px" onclick="placeBet(2)">BET 50</button><div class="h">Auto: <input id="auto2" type="number" value="2.0" style="width:60px;padding:4px"></div></div>
</div>
<div class="card" style="margin:10px"><h3>History</h3><div id="history" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px"></div></div>

<div class="modal" id="authModal"><div class="modalBox">
<div class="tab"><div id="tabLogin" class="active" onclick="switchTab('login')">Login</div><div id="tabSignup" onclick="switchTab('signup')">Signup</div></div>
<div id="loginPane"><input id="lPhone" placeholder="Phone 0712..."><input id="lPass" type="password" placeholder="Password"><button class="btn btn-g" style="width:100%;margin-top:8px" onclick="doLogin()">LOGIN</button></div>
<div id="signupPane" style="display:none"><input id="sPhone" placeholder="Phone 0712..."><input id="sPass" type="password" placeholder="Password"><input id="sConfirm" type="password" placeholder="Confirm Password"><button class="btn btn-y" style="width:100%;margin-top:8px" onclick="doSignup()">CREATE - GET 50 BONUS</button></div>
<button class="btn" style="width:100%;margin-top:8px;background:#222;color:#fff" onclick="closeAuth()">Close</button>
</div></div>

<div class="modal" id="depModal"><div class="modalBox">
<h3>Deposit - Min KES 100</h3>
<input id="depAmt" type="number" placeholder="Amount min 100" min="100" value="100" style="width:100%;padding:12px;background:#000;border:1px solid #333;border-radius:8px;color:#fff;margin-top:8px">
<button class="btn btn-g" style="width:100%;margin-top:8px;padding:12px" onclick="doDeposit()">DEPOSIT VIA M-PESA</button>
<div class="h">Minimum deposit KES 100. Demo adds to balance. Connect Daraja for real STK.</div>
<button class="btn" style="width:100%;margin-top:8px;background:#222;color:#fff" onclick="closeDeposit()">Close</button>
</div></div>

<script>
let mult=1,crashed=false,bets=[null,null],balance=0,curUser=null,history=[];
function $(id){return document.getElementById(id)}
function openAuth(){$('authModal').style.display='flex'}function closeAuth(){$('authModal').style.display='none'}
function switchTab(t){if(t==='login'){$('loginPane').style.display='block';$('signupPane').style.display='none';$('tabLogin').classList.add('active');$('tabSignup').classList.remove('active')}else{$('loginPane').style.display='none';$('signupPane').style.display='block';$('tabLogin').classList.remove('active');$('tabSignup').classList.add('active')}}
function openDeposit(){if(!curUser)return openAuth();$('depModal').style.display='flex'}function closeDeposit(){$('depModal').style.display='none'}
function doDeposit(){let a=parseFloat($('depAmt').value);if(isNaN(a)||a<100)return alert('Minimum deposit is KES 100');balance+=a;updateBal();closeDeposit();alert('Deposited KES '+a+' added!')}
function doSignup(){let ph=$('sPhone').value.trim(),p=$('sPass').value,c=$('sConfirm').value;if(ph.length<10)return alert('Enter valid phone');if(p.length<4)return alert('Password min 4');if(p!==c)return alert('Passwords no match');let users=JSON.parse(localStorage.getItem('fly_users')||'{}');if(users[ph])return alert('User exists, login');users[ph]={pass:p,bal:50};localStorage.setItem('fly_users',JSON.stringify(users));alert('Account created! 50 bonus added. Now login');switchTab('login');$('lPhone').value=ph}
function doLogin(){let ph=$('lPhone').value.trim(),p=$('lPass').value;let users=JSON.parse(localStorage.getItem('fly_users')||'{}');if(!users[ph])return alert('No account, signup first');if(users[ph].pass!==p)return alert('Wrong password');curUser=ph;balance=users[ph].bal;localStorage.setItem('fly_cur',ph);updateBal();closeAuth();$('logoutBtn').style.display='inline-block';alert('Welcome '+ph)}
function logout(){localStorage.removeItem('fly_cur');curUser=null;balance=0;updateBal();$('logoutBtn').style.display='none'}
function updateBal(){$('balText').innerText='KES '+balance;if(curUser){let users=JSON.parse(localStorage.getItem('fly_users')||'{}');if(users[curUser]){users[curUser].bal=balance;localStorage.setItem('fly_users',JSON.stringify(users))}}}
function placeBet(n){if(!curUser)return openAuth();let amt=parseFloat((n===1?$('bet1').value:$('bet2').value));if(isNaN(amt)||amt<50)return alert('Minimum bet is KES 50');if(amt>balance)return alert('Low balance - Deposit min KES 100');if(bets[n-1])return cashout(n);balance-=amt;updateBal();bets[n-1]={amt,active:true};$('b'+n+'Btn').innerText='CASHOUT';$('b'+n+'Btn').style.background='#ffab00';}
function cashout(n){if(!bets[n-1]||!bets[n-1].active)return;let win=bets[n-1].amt*mult;balance+=win;updateBal();bets[n-1]=null;$('b'+n+'Btn').innerText='BET '+(n===1?$('bet1').value:$('bet2').value);$('b'+n+'Btn').style.background='#00c853';}
function addHist(m){history.unshift(m);if(history.length>20)history.pop();$('history').innerHTML=history.map(x=>`<span style="padding:4px 8px;border-radius:12px;background:${x<2?'#ff3344':x<10?'#ffab00':'#00c853'};color:${x<2?'#fff':'#000'};font-size:12px;font-weight:800">${x.toFixed(2)}x</span>`).join('')}
let crashPoint=2;
function startRound(){crashed=false;mult=1;let custom=localStorage.getItem('flybet_next_crash');if(custom){crashPoint=parseFloat(custom);localStorage.removeItem('flybet_next_crash');}else{crashPoint=Math.random()<0.05?50+Math.random()*100:Math.random()<0.3?1+Math.random():1.5+Math.random()*5;} $('crashBox').style.display='none'; let int=setInterval(()=>{if(crashed){clearInterval(int);return} mult+=0.01+mult*0.01; $('mult').innerText=mult.toFixed(2)+'x'; $('plane').style.left=(10+mult*3)+'%'; $('plane').style.bottom=(20+mult*2)+'%'; bets.forEach((b,i)=>{if(b&&b.active){let auto=parseFloat((i===0?$('auto1').value:$('auto2').value));if(mult>=auto)cashout(i+1)}}); if(mult>=crashPoint){crashed=true;$('crashMult').innerText=mult.toFixed(2)+'x';$('crashBox').style.display='flex';addHist(mult);bets=[null,null];[1,2].forEach(n=>{$('b'+n+'Btn').innerText='BET '+$('bet'+n).value;$('b'+n+'Btn').style.background='#00c853'});clearInterval(int);setTimeout(startRound,3000)}},80)}
window.onload=()=>{let c=localStorage.getItem('fly_cur');if(c){let users=JSON.parse(localStorage.getItem('fly_users')||'{}');if(users[c]){curUser=c;balance=users[c].bal;updateBal();$('logoutBtn').style.display='inline-block'}};startRound()}
</script></body></html>
