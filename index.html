<title>FLY BET - FLYBET.CO.KE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial, sans-serif}
body{background:#10131a;color:#fff}
.topbar{background:#171a24;display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-bottom:1px solid #222}
.logo{color:#ffcc00;font-weight:900;font-size:18px;display:flex;align-items:center;gap:4px}
.balance{color:#00e676;font-weight:900;font-size:18px}
.btn-join{background:#ffcc00;color:#000;border:0;padding:8px 18px;border-radius:6px;font-weight:900;cursor:pointer}
.btn-login{background:transparent;color:#fff;border:0;padding:8px 12px;font-weight:700}
.history{display:flex;gap:12px;overflow-x:auto;padding:8px 10px;background:#171a24;white-space:nowrap;scrollbar-width:none}
.history span{font-weight:700;font-size:16px}
.history .blue{color:#29b6f6}.history .purple{color:#ab47bc}
.game-area{background:#000;height:52vh;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;border-radius:16px;margin:10px;overflow:hidden}
#multi{font-size:70px;font-weight:900}
#plane{font-size:36px;position:absolute;left:30%;top:62%;transition:0.1s}
.bet-card{background:#1e222d;border-radius:16px;padding:14px;margin:10px}
.tabs{display:flex;background:#2a2d3a;border-radius:20px;padding:3px;width:220px;margin:0 auto 14px}
.tab{flex:1;padding:6px;border-radius:18px;border:0;background:transparent;color:#888;font-weight:700}
.tab.active{background:#3a3d4a;color:#fff}
.bet-row{display:flex;gap:12px;align-items:center}
.amount-box{background:#2a2d3a;border-radius:20px;display:flex;align-items:center;padding:6px 10px;gap:10px;flex:1}
.amount-box button{width:36px;height:36px;border-radius:50%;border:1px solid #555;background:transparent;color:#fff;font-size:20px}
.amount-box span{font-size:22px;font-weight:900;flex:1;text-align:center}
.quick{display:flex;gap:8px;margin-top:10px}
.quick button{background:#2a2d3a;border:0;color:#aaa;padding:8px 14px;border-radius:20px;font-weight:700}
.btn-bet{flex:1.5;background:#6acf00;color:#fff;border:0;border-radius:12px;padding:14px;font-weight:900;font-size:22px;line-height:1.1;cursor:pointer;box-shadow:0 4px 0 #4a9000}
.btn-bet small{font-size:14px}
.btn-cash{flex:1.5;background:#ff3d00;color:#fff;border:0;border-radius:12px;padding:14px;font-weight:900;font-size:20px;display:none;cursor:pointer}
.dep-modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:none;align-items:center;justify-content:center;z-index:9999}
.dep-modal.active{display:flex}
.dep-box{background:#1e222d;padding:20px;border-radius:16px;width:90%;max-width:360px}
.dep-box h3{color:#ffcc00;margin-bottom:10px}
.dep-box input{width:100%;padding:12px;border-radius:8px;border:0;margin:6px 0;background:#2a2d3a;color:#fff}
.dep-box button{width:100%;padding:12px;border:0;border-radius:8px;font-weight:900;margin-top:8px;cursor:pointer}
.stk{background:#6acf00;color:#fff}
.with-btn{position:fixed;right:12px;bottom:120px;background:#ff9800;color:#fff;border:0;padding:10px 14px;border-radius:20px;font-weight:900;z-index:100;cursor:pointer}
</style>
</head>
