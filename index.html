<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlyBet Kenya - Aviator</title>
<style>
body{margin:0;background:#0a0e1a;color:#fff;font-family:Arial;overflow:hidden}
#game{height:60vh;background:linear-gradient(#1a2a4a,#0a0e1a);position:relative;display:flex;align-items:center;justify-content:center}
#plane{font-size:50px;position:absolute;left:10%;bottom:30%;transition:all 0.1s}
#multi{font-size:70px;font-weight:bold;color:#ffcc00}
#controls{padding:15px;background:#111827}
.btn{width:100%;padding:18px;font-size:20px;font-weight:bold;border:none;border-radius:12px;cursor:pointer;margin:5px 0}
.bet{background:#22c55e;color:#fff}
.cash{background:#f59e0b;color:#000}
.dep{background:#3b82f6;color:#fff}
input{width:100%;padding:15px;border-radius:10px;border:none;font-size:18px;margin:5px 0;background:#1f2937;color:#fff;box-sizing:border-box}
#modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);align-items:center;justify-content:center;z-index:100}
#modalBox{background:#1f2937;padding:20px;border-radius:15px;width:90%;max-width:400px}
</style>
</head>
<body>

<div id="game">
  <div id="multi">1.00x</div>
  <div id="plane">✈️</div>
</div>

<div id="controls">
  <div>Balance: <span id="bal">0.00</span> KES | Min Deposit 100</div>
  <input id="betAmt" type="number" value="100" min="100" placeholder="Min 100">
  <button class="btn bet" id="betBtn" onclick="placeBet()">BET 100</button>
  <button class="btn cash" id="cashBtn" onclick="cashOut()" style="display:none">CASHOUT</button>
  <button class="btn dep" onclick="openDep()">DEPOSIT (Min 100)</button>
  <div id="status" style="margin-top:10px;color:#22c55e"></div>
</div>

<div id="modal">
  <div id="modalBox">
    <h3>Deposit - Min 100 KES</h3>
    <input id="depPhone" type="tel" placeholder="07XXXXXXXX">
    <input id="depAmt" type="number" value="100" min="100" placeholder="Min 100">
    <button class="btn dep" onclick="doDeposit()">PAY NOW</button>
    <button class="btn" onclick="closeDep()" style="background:#374151">CLOSE</button>
    <div id="depStatus"></div>
  </div>
</div>

<script>
const API="https://crashstats-api.onrender.com";
let balance=parseFloat(localStorage.getItem('bal')||'0');
let betting=false, curMult=1, crashPoint=2, gameInterval, inRound=false, betValue=0;
document.getElementById('bal').innerText=balance.toFixed(2);

function placeBet(){
  if(inRound) return;
  betValue=parseInt(document.getElementById('betAmt').value);
  if(betValue<100){alert('Min bet 100');return;}
  if(betValue>balance){alert('Deposit first - Min 100');openDep();return;}
  balance-=betValue; localStorage.setItem('bal',balance); document.getElementById('bal').innerText=balance.toFixed(2);
  betting=true; document.getElementById('betBtn').style.display='none'; document.getElementById('cashBtn').style.display='block';
  startRound();
}
function startRound(){
  inRound=true; curMult=1; crashPoint=parseFloat((Math.random()*9+1.2).toFixed(2));
  document.getElementById('status').innerText='Flying... Crash at '+crashPoint+'x';
  gameInterval=setInterval(()=>{
    curMult+=0.02; if(curMult>3) curMult+=0.05; if(curMult>5) curMult+=0.1;
    document.getElementById('multi').innerText=curMult.toFixed(2)+'x';
    document.getElementById('plane').style.left=(10+curMult*5)+'%';
    document.getElementById('plane').style.bottom=(30+curMult*3)+'%';
    if(curMult>=crashPoint){
      clearInterval(gameInterval); document.getElementById('multi').innerText='CRASHED '+curMult.toFixed(2)+'x'; document.getElementById('multi').style.color='#ef4444';
      if(betting){ document.getElementById('status').innerText='Crashed! Lost '+betValue; betting=false; }
      setTimeout(resetRound,3000);
    }
  },80);
}
function cashOut(){
  if(!betting||!inRound) return;
  clearInterval(gameInterval); let win=betValue*curMult; balance+=win; localStorage.setItem('bal',balance);
  document.getElementById('bal').innerText=balance.toFixed(2); document.getElementById('status').innerText='Won '+win.toFixed(2)+' at '+curMult.toFixed(2)+'x'; betting=false; resetRound();
}
function resetRound(){
  inRound=false; curMult=1; document.getElementById('multi').innerText='1.00x'; document.getElementById('multi').style.color='#ffcc00';
  document.getElementById('plane').style.left='10%'; document.getElementById('plane').style.bottom='30%';
  document.getElementById('betBtn').style.display='block'; document.getElementById('cashBtn').style.display='none';
}
function openDep(){document.getElementById('modal').style.display='flex';}
function closeDep(){document.getElementById('modal').style.display='none';}
async function doDeposit(){
  let phone=document.getElementById('depPhone').value; let amount=parseInt(document.getElementById('depAmt').value);
  if(amount<100){alert('Min deposit is 100 KES');return;}
  if(!phone){alert('Enter phone');return;}
  document.getElementById('depStatus').innerText='Sending STK to '+phone+'...';
  try{
    const res=await fetch(API+'/api/stkpush',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone,amount})});
    const data=await res.json();
    if(data.success){
      document.getElementById('depStatus').innerText='STK sent! Check phone to pay Till. After pay, balance will update.';
      setTimeout(()=>{balance+=amount; localStorage.setItem('bal',balance); document.getElementById('bal').innerText=balance.toFixed(2); closeDep();},2000);
    }else{
      document.getElementById('depStatus').innerText='Error: '+(data.error||JSON.stringify(data));
    }
  }catch(e){document.getElementById('depStatus').innerText='Failed: '+e.message;}
}
setInterval(async()=>{try{let r=await fetch(API+'/'); let j=await r.json(); document.getElementById('status').innerText=j.message||'Live';}catch{}},5000);
</script>
</body>
</html>
