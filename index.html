<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REAL</title><style>body{background:#0f1216;color:#fff;font-family:sans-serif;padding:12px}header{display:flex;justify-content:space-between;background:#171b21;padding:14px;border-radius:10px}.logo{color:#0f8;font-weight:900}.panel{background:#171b21;border:1px solid #333;border-radius:10px;padding:14px;margin-top:12px}#multiplier{font-size:52px;font-weight:900;text-align:center;margin:15px 0}button{width:100%;padding:15px;border-radius:9px;border:0;font-weight:bold;font-size:16px;margin-top:10px}.play{background:#16b87b}.dep{background:#ff42af;color:#fff}input{width:100%;padding:12px;border-radius:8px;background:#101216;color:#fff;border:1px solid #333;margin-top:8px}li{list-style:none;padding:5px 0;border-bottom:1px solid #222}</style></head><body><header><div class="logo">✈️ CrashStats REAL</div><div>Live: <span id="b">1000</span></div></header><div class="panel"><div id="multiplier">1.00x</div><p id="s" style="text-align:center">Loading REAL...</p><button id="pb" class="play" onclick="play()">PLAY REAL ROUND</button></div><div class="panel"><input id="amt" type="number" placeholder="10-10000"><button class="dep" onclick="dep()">ADD DEMO</button><p id="ds"></p></div><div class="panel"><h3>Recent REAL</h3><ul id="h"><li>Loading...</li></ul></div><script>
const API="https://aviator-kenyacoke-production.up.railway.app";let bal=1000,playing=!1,cm=1,cashed=!1,t=null;function ub(){document.getElementById("b").innerText=bal}async function lh(){try{let r=await fetch(API+"/api/history"),d=await r.json(),u=document.getElementById("h");u.innerHTML="";d.slice(0,12).forEach(x=>{let l=document.createElement("li");l.innerHTML=`Round #${x.round}: <b style="color:${x.crash<2?'#f55':x.crash<5?'#fa0':'#0f8'}">${x.crash}x</b>`;u.appendChild(l)})}catch(e){}}async function gc(){try{let r=await fetch(API+"/api/current");return await r.json()}catch(e){return{id:0,crashPoint:2.5}}}function dep(){let a=Number(document.getElementById("amt").value);if(a<10)return;bal+=a;ub();document.getElementById("ds").innerText="+"+a+" demo"}async function play(){if(playing)return;let bet=100,r=await gc();playing=!0;cashed=!1;bal-=bet;ub();let b=document.getElementById("pb"),d=document.getElementById("multiplier"),st=document.getElementById("s");b.innerText="FLYING - TAP TO CASHOUT";b.style.background="#fa0";st.innerText=`Round #${r.id} crash ${r.crashPoint}x`;let m=1;clearInterval(t);t=setInterval(()=>{m+=0.04+m*0.02;if(m>=r.crashPoint){m=r.crashPoint;clearInterval(t);d.innerText=m.toFixed(2)+"x CRASHED";d.style.color="#f33";if(!cashed)st.innerText=`Crashed ${m}x Lost ${bet}`;b.innerText="PLAY REAL ROUND";b.style.background="#16b87b";b.onclick=play;playing=!1;lh()}else{d.innerText=m.toFixed(2)+"x";d.style.color="#0f8";cm=m}},70);b.onclick=()=>{if(!playing||cashed)return;cashed=!0;let w=bet*cm;bal+=w;ub();st.innerText=`Cashed ${cm.toFixed(2)}x Won ${w.toFixed(0)}!`;}}ub();lh();setInterval(lh,4000);
</script></body></html>
