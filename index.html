
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CrashStats Kenya</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; background: #101216; color: white;
      font-family: Arial, sans-serif;
    }
    header {
      padding: 18px; background: #191d23;
      display: flex; justify-content: space-between;
      align-items: center; border-bottom: 1px solid #333;
    }
    .logo { color: #ff424f; font-size: 23px; font-weight: bold; }
    .balance { color: #8fffc0; font-weight: bold; }
    main { max-width: 600px; margin: auto; padding: 16px; }
    .panel {
      background: #191d23; border: 1px solid #303640;
      border-radius: 14px; padding: 18px; margin-bottom: 16px;
    }
    .game {
      text-align: center; min-height: 230px;
      background: radial-gradient(ellipse at bottom, #183b36, #11151c 70%);
      overflow: hidden;
    }
    .multiplier {
      font-size: 54px; font-weight: bold;
      color: #8fffc0; margin: 30px 0 10px;
    }
    button {
      border: 0; border-radius: 9px; padding: 14px;
      width: 100%; font-size: 16px; font-weight: bold;
      cursor: pointer; margin-top: 10px;
    }
    .play { background: #16b879; color: #071a12; }
    .deposit { background: #ff424f; color: white; }
    input {
      width: 100%; padding: 13px; border-radius: 8px;
      border: 1px solid #414752; background: #101216;
      color: white; margin-top: 10px;
    }
    .muted { color: #a8b0bb; font-size: 13px; }
    li { padding: 6px 0; color: #cbd1da; }
  </style>
</head>
<body>
  <header>
    <div class="logo">✈ CrashStats</div>
    <div class="balance">Demo: <span id="balance">1000</span> credits</div>
  </header>

  <main>
    <div class="panel game">
      <p class="muted">CRASH GAME DEMO</p>
      <div class="multiplier" id="multiplier">1.00x</div>
      <p id="status">Ready for a demo round?</p>
      <button class="play" id="play" onclick="playRound()">
        PLAY DEMO
      </button>
    </div>

    <div class="panel">
      <h3>💳 Deposit</h3>
      <p class="muted">Demo only — no real money is collected.</p>
      <input id="amount" type="number" min="10"
        placeholder="Enter demo amount (credits)">
      <button class="deposit" onclick="demoDeposit()">
        ADD DEMO CREDITS
      </button>
      <p class="muted" id="depositStatus">
        M-Pesa live payments are not connected.
      </p>
    </div>

    <div class="panel">
      <h3>📊 Recent rounds</h3>
      <ul id="history">
        <li>Welcome to CrashStats</li>
      </ul>
    </div>

    <p class="muted" style="text-align:center">
      Demonstration only. Credits have no cash value.
      No real deposits or withdrawals.
    </p>
  </main>

  <script>
    let balance = 1000;
    let playing = false;

    function updateBalance() {
      document.getElementById("balance").textContent =
        balance.toFixed(0);
    }

    function demoDeposit() {
      const amount = Number(document.getElementById("amount").value);
      if (!Number.isFinite(amount) || amount < 10 || amount > 10000) {
        document.getElementById("depositStatus").textContent =
          "Enter an amount between 10 and 10000 demo credits.";
        return;
      }
      balance += amount;
      updateBalance();
      document.getElementById("depositStatus").textContent =
        "Demo credits added. No money was charged.";
    }

    function playRound() {
      if (playing) return;
      playing = true;

      const button = document.getElementById("play");
      const display = document.getElementById("multiplier");
      const status = document.getElementById("status");

      button.disabled = true;
      button.textContent = "ROUND RUNNING...";
      status.textContent = "Demo round in progress";
      display.style.color = "#8fffc0";

      let multiplier = 1;
      const crashAt = 1.1 + Math.random() * 4.9;

      const timer = setInterval(() => {
        multiplier += 0.04 + multiplier * 0.018;
        display.textContent = multiplier.toFixed(2) + "x";

        if (multiplier >= crashAt) {
          clearInterval(timer);
          display.textContent = crashAt.toFixed(2) + "x";
          display.style.color = "#ff424f";
          status.textContent = "CRASH! Demo round ended.";
          const item = document.createElement("li");
          item.textContent = "Demo crash: " + crashAt.toFixed(2) + "x";
          document.getElementById("history").prepend(item);
          playing = false;
          button.disabled = false;
          button.textContent = "PLAY DEMO";
        }
      }, 100);
    }
  </script>
</body>
  </html>
