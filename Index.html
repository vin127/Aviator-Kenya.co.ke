<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>CrashStats - REAL</title><style>*{box-sizing:border-box;margin:0;padding:0}body{background:#0f1216;color:#cbd1da;font-family:system-ui;padding:12px}header{display:flex;justify-content:space-between;align-items:center;background:#171b21;padding:14px;border-radius:10px;margin-bottom:12px;border:1px solid #242a33}.logo{font-weight:900;color:#00ff88}.balance{font-weight:bold;color:#fff}.balance span{color:#00ff88}.panel{background:#171b21;border:1px solid #242a33;border-radius:10px;padding:14px;margin-bottom:12px}.muted{color:#8a8b8b;font-size:13px}li{padding:6px 0;list-style:none;border-bottom:1px solid #222}.multiplier{font-size:48px;font-weight:900;text-align:center;color:#fff;margin:10px 0}button{border:0;border-radius:9px;padding:14px;width:100%;font-size:16px;font-weight:bold;cursor:pointer;margin-top:10px}.play{background:#16b87b}.deposit{background:#ff42af;color:white}input{width:100%;padding:13px;border-radius:8px;border:1px solid #414752;background:#101216;color:white;margin-top:10px}</style></head><body><header><div class="logo">✈️ CrashStats REAL</div><div class="balance">Live: <span id="balance">1000</span></div></header><main><div class="panel"><p class="muted" style="text-align:center">REAL CRASH ENGINE LIVE</p><div class="multiplier" id="multiplier">1.00x</div><p id="status" style="text-align:center;font-weight:bold">Connecting...</p><button class="play" id="play" onclick="playRound()">PLAY REAL ROUND</button></div><div class="panel"><h3>Deposit</h3><p class="muted">Demo only - no real money</p><input id="amount" type="number" placeholder="Enter 10-10000"><button class="deposit" onclick="demoDeposit()">ADD DEMO CREDITS</button><p class="muted" id="depositStatus">M-Pesa not connected yet</p></div><div class="panel"><h3>📊 Recent Rounds REAL</h3><ul id="history"><li>Loading real history from Railway...</li></ul></div></main><script>
const API="https://aviator-kenyacoke-production.up.railway.app";
let balance=1000,playing=false,curMult=1,hasCashed=false,tmr=null;
function updateBalance(){document.getElementById("balance").textContent=balance;}
async function loadHistory(){
 try{
  const r=await fetch(API+"/api/history");const d=await r.json();
  const ul=document.getElementById("history");ul.innerHTML="";
  d.slice(0,15).forEach(v=>{
   const li=document.createElement("li");
   li.innerHTML=`Round #${v.round}: <b style="color:${v.crash<2?'#f55':v.crash<5?'#fb0':'#0f8'}">${v.crash}x</b>`;
   ul.appendChild(li);
  });
 }catch(e){document.getElementById("history").innerHTML="<li>Backend waking up...</li>";}
}
async function getCurrent(){try{const r=await fetch(API+"/api/current");return await r.json();}catch(e){return {id:Date.now(),crashPoint:(Math.random()*5+1).toFixed(2)};}}
function demoDeposit(){const a=Number(document.getElementById("amount").value);if(a<10||a>10000){document.getElementById("depositStatus").textContent="10-10000 only";return;}balance+=a;updateBalance();document.getElementById("depositStatus").textContent=`+${a} demo credits (no money)`;}
async function playRound(){
 if(playing)return;
 const bet=100;const rnd=await getCurrent();playing=true;hasCashed=false;balance-=bet;updateBalance();
 const btn=document.getElementById("play");const disp=document.getElementById("multiplier");const stat=document.getElementById("status");
 btn.textContent="FLYING - TAP TO CASHOUT";btn.style.background="#ffb700";disp.style.color="#0f8";stat.textContent=`Round #${rnd.id} crash at ${rnd.crashPoint}x (real)`;
 let m=1;clearInterval(tmr);
 tmr=setInterval(()=>{
  m+=0.04+m*0.02;if(m>=rnd.crashPoint){m=rnd.crashPoint;clearInterval(tmr);disp.textContent=m.toFixed(2)+"x CRASHED";disp.style.color="#f33";if(!hasCashed)stat.textContent=`Crashed ${m}x Lost ${bet}`;btn.textContent="PLAY REAL ROUND";btn.style.background="#16b87b";btn.onclick=playRound;playing=false;loadHistory();}else{disp.textContent=m.toFixed(2)+"x";curMult=m;}
 },70);
 btn.onclick=()=>{
  if(!playing||hasCashed)return;hasCashed=true;const win=bet*curMult;balance+=win;updateBalance();stat.textContent=`CASHED ${curMult.toFixed(2)}x Won ${win.toFixed(0)}!`;
 };
}
updateBalance();loadHistory();setInterval(loadHistory,5000);
</script></body></html>
